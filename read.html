<script>
window.FAMI_WEB_READER = true;
(function () {
  var KEY_RE = /^[A-Za-z0-9_-]{8,128}$/;
  var stored = "";
  try { stored = localStorage.getItem("famibook.viewKey") || ""; } catch (e) {}
  var cookie = "";
  try {
    var m = document.cookie.match(/(?:^|; )famibook\.viewKey=([^;]*)/);
    cookie = m ? decodeURIComponent(m[1]) : "";
  } catch (e) {}
  var q = new URLSearchParams(location.search);
  var k = q.get("k") || "";
  var h = "";
  try {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw.indexOf("k=") === 0) {
      h = decodeURIComponent((raw.slice(2).split("&")[0] || "").replace(/\+/g, " "));
    } else {
      h = new URLSearchParams(raw).get("k") || "";
    }
  } catch (e) {}
  var fromUrl = KEY_RE.test(k) ? k : KEY_RE.test(h) ? h : "";
  var token = fromUrl || (KEY_RE.test(stored) ? stored : "") || (KEY_RE.test(cookie) ? cookie : "");
  if (token) {
    try { localStorage.setItem("famibook.viewKey", token); } catch (e) {}
    q.set("k", token);
    var pin = location.pathname + "?" + q.toString() + "#k=" + encodeURIComponent(token);
    if (location.pathname + location.search + location.hash !== pin) {
      history.replaceState({}, "", pin);
    }
  }
  // One dummy is not enough, and identical URLs get merged so one swipe
  // still pops through to the shelf. Unique hashes keep each pad distinct.
  window.__famiReaderStay = true;
  window.__famiStaySeq = 0;
  function stayUrl(n) {
    var raw = (location.hash || "").replace(/^#/, "").replace(/&?stay=\d+/g, "");
    if (raw.slice(-1) === "&") raw = raw.slice(0, -1);
    return location.pathname + location.search + "#" + (raw ? raw + "&stay=" + n : "stay=" + n);
  }
  function stayInReader() {
    try {
      window.__famiStaySeq += 1;
      history.pushState({ famiReader: 1, n: window.__famiStaySeq }, "", stayUrl(window.__famiStaySeq));
      window.__famiStaySeq += 1;
      history.pushState({ famiReader: 1, n: window.__famiStaySeq }, "", stayUrl(window.__famiStaySeq));
    } catch (e) {}
  }
  var embedded = false;
  try { embedded = window.parent && window.parent !== window; } catch (e) {}
  if (!embedded) {
    stayInReader();
    window.addEventListener("popstate", stayInReader);
    window.addEventListener("pageshow", stayInReader);
  } else {
    try { window.parent.postMessage({ fami: "reader-loading" }, location.origin); } catch (e) {}
  }
  var bookId = q.get("book") || "";
  if (bookId) {
    try {
      var prev = {};
      try { prev = JSON.parse(sessionStorage.getItem("famibook.reading") || "{}") || {}; } catch (e) {}
      sessionStorage.setItem("famibook.reading", JSON.stringify({
        book: bookId,
        k: token || "",
        end: q.get("end") || "",
        cover: prev.cover || ""
      }));
    } catch (e) {}
  }
  var origin = String(window.VAULT_ORIGIN || "").replace(/\/$/, "");
  if (origin) {
    var pre = document.createElement("link");
    pre.rel = "preconnect";
    pre.href = origin;
    pre.crossOrigin = "anonymous";
    document.head.appendChild(pre);
    var files = ["css/global.css", "css/read.css", "css/navImage.css", "css/navMenu.css", "css/config.css", "css/mybook.css"];
    for (var i = 0; i < files.length; i++) {
      document.write('<link rel="stylesheet" href="' + origin + "/static/" + files[i] + '?v=20"/>');
    }
  }
})();
</script>

        <button type="button" class="settings-entry" id="repairVolumeBtn" role="menuitem" hidden>
          <span class="ins-icon job-icon" aria-hidden="true">
            <span class="ins-ring"></span>
            <span class="ins-face">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5h12v13H6z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 9h6M9 12.5h6M9 16h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </span>

          <span class="ins-icon job-icon" aria-hidden="true">
            <span class="ins-ring"></span>
            <span class="ins-face">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.6 3.8l.6-1.3h3.6l.6 1.3 1.6.7 1.4-.5 2.5 2.5-.5 1.4.7 1.6 1.3.6v3.6l-1.3.6-.7 1.6.5 1.4-2.5 2.5-1.4-.5-1.6.7-.6 1.3h-3.6l-.6-1.3-1.6-.7-1.4.5-2.5-2.5.5-1.4-.7-1.6-1.3-.6v-3.6l1.3-.6.7-1.6-.5-1.4L6.6 4l1.4.5 1.6-.7z" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/><circle cx="12" cy="11.9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
          </span>
          <span>設定</span>
        </button>
        <button type="button" class="settings-entry" id="backToShelf" role="menuitem">
          <span class="ins-icon job-icon" aria-hidden="true">
            <span class="ins-ring"></span>
            <span class="ins-face">

            </span>

        <span class="tag-apply-face">確認</span>
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("selectstart", function (e) {
    if (e.target && e.target.closest && e.target.closest("input, textarea, select")) return;
    e.preventDefault();
  });
  var origin = String(window.VAULT_ORIGIN || "").replace(/\/$/, "");
  var book = new URLSearchParams(location.search).get("book") || "";
  if (!origin || !book) {
    var loader = document.getElementById("loaderContainer");
    if (loader) loader.innerHTML = '<p class="read-miss">維護中,請5分鐘後再試</p>';
    return;
  }
  var s = document.createElement("script");
  s.src = origin + "/static/reader.js?v=31";
  s.async = false;
  document.body.appendChild(s);
})();
</script>
